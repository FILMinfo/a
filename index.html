<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Full Movie Online</title>
    
    <!-- Meta Data Facebook (Fallback) -->
    <meta property="og:type" content="video.movie" />
    <meta property="og:title" content="Watch Full Movie Online" id="og-title" />
    <meta property="og:description" content="Stream the latest movies in HD quality." id="og-desc" />
    <meta property="og:image" content="" id="og-img" />

    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #0b0f19;
            --surface: #151a27;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --rating: #fbbf24;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px; 
            display: flex;
            flex-direction: column;
            gap: 10px; 
        }

        /* Fake Embed Video Player */
        .player-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .player-box img.backdrop {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.45; 
            transition: opacity 0.3s;
        }

        .player-box:hover img.backdrop { opacity: 0.3; }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80px; height: 80px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            z-index: 2;
            transition: all 0.2s ease;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .play-btn::after {
            content: '';
            border-top: 22px solid transparent;
            border-bottom: 22px solid transparent;
            border-left: 32px solid #0b0f19;
            margin-left: 10px; 
        }

        .player-box:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: #ffffff;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        /* Movie Info Section */
        .info-box {
            background-color: var(--surface);
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .info-box h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
            color: #ffffff;
        }

        .meta-data {
            display: flex; gap: 16px; align-items: center;
            margin-bottom: 12px; font-size: 0.95rem; font-weight: 600;
        }

        .meta-data .rating { color: var(--rating); }
        .meta-data .quality { background: #eab308; color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 800;}

        .info-box .desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info-box .cast {
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .cast strong { color: #fff; }

        /* Trending Movies Section */
        .related-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 10px 0 6px 0;
            padding-left: 10px;
            border-left: 4px solid var(--accent);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px; 
        }

        .movie-card {
            position: relative;
            aspect-ratio: 2 / 3;
            background-color: var(--surface);
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .movie-card:hover { transform: translateY(-4px); }

        .movie-card img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .movie-card .card-title {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            padding: 24px 8px 8px 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Professional In-App Browser Popup */
        .ia-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999999;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .ia-modal {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%; max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: scaleUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes scaleUp {
            0% { transform: scale(0.95) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .ia-icon-wrap {
            width: 72px; height: 72px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
        }
        .ia-icon-wrap svg { width: 36px; height: 36px; color: var(--accent); }
        .ia-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 12px; }
        .ia-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; }
        .ia-btn {
            display: block; width: 100%;
            background: var(--accent); color: #fff;
            padding: 16px; border-radius: 12px;
            font-weight: 600; font-size: 1.05rem;
            text-decoration: none; transition: background 0.2s;
        }
        .ia-btn:hover { background: var(--accent-hover); }
        
        .ia-ios-instruction {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.15);
            padding: 16px; border-radius: 12px;
            color: #e2e8f0; font-size: 0.95rem; line-height: 1.6; text-align: left;
        }
        .ia-ios-instruction strong { color: #fff; display: block; margin-bottom: 8px; font-size: 1.05rem;}

        /* Responsive Design */
        @media (max-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
            .info-box h1 { font-size: 1.3rem; }
            .play-btn { width: 60px; height: 60px; }
            .play-btn::after { border-top: 16px solid transparent; border-bottom: 16px solid transparent; border-left: 24px solid #0b0f19; margin-left: 8px;}
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fake Player -->
        <div class="player-box" onclick="redirectToOffer()">
            <img src="" alt="Backdrop" class="backdrop" id="player-bg">
            <div class="play-btn"></div>
        </div>

        <!-- Movie Info -->
        <div class="info-box">
            <h1 id="movie-title">Loading...</h1>
            <div class="meta-data">
                <span class="quality">HD</span>
                <span class="rating" id="movie-rating">⭐ 0.0 / 10</span>
            </div>
            <p class="desc" id="movie-desc">Please wait while data is being fetched...</p>
            <div class="cast"><strong>Cast:</strong> <span id="movie-cast">...</span></div>
        </div>

        <!-- Trending Movies Grid -->
        <div class="related-title">Trending Today</div>
        <div class="grid" id="related-grid">
            <!-- Thumbnail digenerate via JS -->
        </div>
    </div>

    <script>
        // ==========================================================
        //                       PENGATURAN API
        // ==========================================================
        const API_KEY = 'ff4a228b2bde4cea37efcc472696d620'; 
        
        // Link Default jika pengambilan dari Github gagal
        let TARGET_URL = 'https://spreadpreferencetelevision.com/hhqe0ruxga?key=e3ff974fd2665b1074e29d32efa30da4'; 
        
        // Fungsi Redirect
        function redirectToOffer() {
            window.location.href = TARGET_URL;
        }

        // ==========================================================
        // 1. Ambil Link Random dari .txt
        // ==========================================================
        async function fetchRandomLink() {
            try {
                const response = await fetch('https://seribudollarperhari.github.io/banner/link.txt');
                const text = await response.text();
                // Pisahkan per baris, bersihkan spasi, dan pastikan itu format URL (http)
                const links = text.split('\n').map(l => l.trim()).filter(l => l.startsWith('http'));
                
                if (links.length > 0) {
                    // Pilih satu link secara acak
                    TARGET_URL = links[Math.floor(Math.random() * links.length)];
                }
            } catch (error) {
                console.error("Failed to fetch random link, using default.", error);
            }
            
            // Setelah link didapat, periksa apakah dibuka via In-App Browser (FB/IG/TikTok)
            checkInAppBrowser();
        }

        // ==========================================================
        // 2. Deteksi & Tampilkan Popup Profesional untuk In-App Browser
        // ==========================================================
        function checkInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppBrowser = /FBAN|FBAV|Instagram|TikTok|Line|Twitter|Threads/i.test(ua);
            
            if (isInAppBrowser) {
                let parsedUrl;
                try {
                    parsedUrl = new URL(TARGET_URL);
                } catch(e) {
                    parsedUrl = new URL("https://google.com");
                }
                
                let normalHref = parsedUrl.href;
                let intentTarget = parsedUrl.host + parsedUrl.pathname + parsedUrl.search;
                let fallbackEncoded = encodeURIComponent(normalHref);
                
                let actionHTML = '';
                
                // Cek Perangkat Android atau iOS
                if (/android/i.test(ua)) {
                    const intentUrl = `intent://${intentTarget}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallbackEncoded};end`;
                    actionHTML = `<a href="${intentUrl}" class="ia-btn">Continue to Browser</a>`;
                } else if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                    actionHTML = `
                    <div class="ia-ios-instruction">
                        <strong>Action Required</strong>
                        Tap the <b>three dots (...)</b> at the top right corner and select <b>"Open in Browser"</b> or <b>"Open in Safari"</b> to watch the movie smoothly.
                    </div>`;
                } else {
                    actionHTML = `<a href="${normalHref}" class="ia-btn">Continue to Browser</a>`;
                }
                
                const sheetHTML = `
                <div class="ia-overlay">
                    <div class="ia-modal">
                        <div class="ia-icon-wrap">
                            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.958 17.958 0 0112 14.25c-3.007 0-5.83-.808-8.284-2.253m16.568 0A8.959 8.959 0 013 12c0-.778.099-1.533.284-2.253M12 21c-2.485 0-4.5-4.03-4.5-9"></path>
                            </svg>
                        </div>
                        <div class="ia-title">Optimal Experience</div>
                        <div class="ia-desc">For the best streaming quality and to prevent playback issues, please open this page in your default system browser.</div>
                        ${actionHTML}
                    </div>
                </div>`;
                
                document.body.style.overflow = 'hidden'; // Kunci scroll
                document.body.insertAdjacentHTML('beforeend', sheetHTML);
            }
        }

        // ==========================================================
        // 3. Ambil Data API Film (Random di Main Screen)
        // ==========================================================
        async function loadMovieData() {
            try {
                // Fetch Trending Movies
                const resTrending = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${API_KEY}&language=en-US`);
                const trending = await resTrending.json();

                // Acak daftar trending untuk mencari film utama secara random
                const shuffled = trending.results.sort(() => 0.5 - Math.random());
                const mainMovie = shuffled[0]; // Ambil 1 film random untuk player utama

                // Fetch Detail & Cast (Credits) untuk film utama
                const resCredits = await fetch(`https://api.themoviedb.org/3/movie/${mainMovie.id}/credits?api_key=${API_KEY}`);
                const credits = await resCredits.json();

                // Format Judul & Tahun
                const year = mainMovie.release_date ? mainMovie.release_date.substring(0, 4) : '2024';
                const formattedTitle = `Watch ${mainMovie.title} ${year} Stream Online`;
                const rating = mainMovie.vote_average ? mainMovie.vote_average.toFixed(1) : '0.0';

                // Update UI: Info Film Utama
                document.getElementById('movie-title').innerText = formattedTitle;
                document.getElementById('movie-desc').innerText = mainMovie.overview;
                document.getElementById('movie-rating').innerText = `⭐ ${rating} / 10`;
                document.getElementById('player-bg').src = `https://image.tmdb.org/t/p/w1280${mainMovie.backdrop_path}`;
                
                // Update Cast (5 Pemeran Teratas)
                const topCast = credits.cast.slice(0, 5).map(c => c.name).join(', ');
                document.getElementById('movie-cast').innerText = topCast || 'Data cast not available';

                // Update Meta Browser
                document.title = formattedTitle;
                document.getElementById('og-title').setAttribute('content', formattedTitle);
                document.getElementById('og-desc').setAttribute('content', mainMovie.overview);
                document.getElementById('og-img').setAttribute('content', `https://image.tmdb.org/t/p/w780${mainMovie.backdrop_path}`);

                // Update UI: Trending Grid di Bawah (Pilih 6 film selain film utama)
                const gridMovies = shuffled.slice(1, 7);
                const grid = document.getElementById('related-grid');
                
                gridMovies.forEach(item => {
                    if (item.poster_path) {
                        const card = document.createElement('div');
                        card.className = 'movie-card';
                        card.onclick = redirectToOffer;
                        card.innerHTML = `
                            <img src="https://image.tmdb.org/t/p/w342${item.poster_path}" alt="${item.title}" loading="lazy">
                            <div class="card-title">${item.title}</div>
                        `;
                        grid.appendChild(card);
                    }
                });

            } catch (error) {
                console.error("API Load Error:", error);
                document.getElementById('movie-title').innerText = "Movie Server Error / Try Again";
            }
        }

        // ==========================================================
        // Eksekusi Semua Fungsi Saat Halaman Dimuat
        // ==========================================================
        window.onload = async function() {
            await fetchRandomLink(); // Tarik link lalu jalankan cek in-app browser
            await loadMovieData();   // Render data API Film
        };
    </script>
</body>
</html>
